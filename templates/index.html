<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wakulima Nane Ltd</title>
<style>
body{font-family:Arial;background:#f0fdf4;margin:0;padding:15px}
.header{background:#16a34a;color:white;padding:18px;border-radius:12px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:15px}
.card{background:white;padding:14px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,0.08);border-left:5px solid #22c55e}
.price{font-weight:bold;color:#16a34a;font-size:1.2em}
.badge{background:#dcfce7;color:#166534;padding:2px 7px;border-radius:10px;font-size:0.7em}
input{width:100%;padding:10px;border:2px solid #16a34a;border-radius:8px}
</style></head><body>
<div class="header"><h1 style="margin:0">🌾 Wakulima Nane Ltd</h1><p>8 Farmers • Farm + Home Pests</p></div>
  <img src="/static/banner.jpg" style="width:100%; height:260px; object-fit:cover; border-radius:12px; margin:15px 0;">
<input id="search" placeholder="Search: Armyworm, Bedbugs, Mosquitoes..." onkeyup="filter()">
<div id="grid" class="grid"></div>
  <div style="background:#e8f5e9; padding:25px; margin-top:25px; border-radius:15px; text-align:center; border:2px solid #16a34a;">
  <h2 style="color:#16a34a; margin:0;">🌿 OUR SERVICES 🌿</h2>
  <p style="font-size:18px; font-weight:bold; margin:8px 0;">✓ Site Visit for Consultation</p>
  <p style="font-size:18px; font-weight:bold; margin:8px 0;">✓ Fumigation and Pest Control Services</p>
  <img src="/static/fumigation-team.jpg" style="width:100%; height:320px; object-fit:cover; border-radius:12px; margin:12px 0;">
  <p style="font-size:20px; color:#16a34a; font-weight:bold; margin-top:15px;">📞 Just a Call Away! ☺️</p>
  <a href="https://wa.me/254716339290?text=Habari%20Wakulima%20Nane%20Nahitaji%20site%20visit%20consultation" style="display:inline-block; background:#22c55e; color:white; padding:12px 25px; border-radius:30px; text-decoration:none; font-weight:bold; margin-top:10px;">📱 Book Site Visit Now</a>
</div>
<script>
let all={{ products|tojson }};
function render(l){
document.getElementById('grid').innerHTML=l.map(p=>`
<div class="card">
<b>${p.pest}</b><br>${p.chemical}<br><small>${p.use}</small>
<div class="price">From KSh ${p.price} <span class="badge">Wholesale on call</span></div>
<a href="https://wa.me/254716339290?text=Nataka ${p.chemical}" style="display:block;background:#22c55e;color:white;text-align:center;padding:7px;border-radius:6px;text-decoration:none;margin-top:8px">Order WhatsApp</a>
</div>`).join('');
}
function filter(){
let q=document.getElementById('search').value.toLowerCase();
render(all.filter(p=>p.pest.toLowerCase().includes(q)||p.chemical.toLowerCase().includes(q)))
}
render(all);
</script></body></html>
